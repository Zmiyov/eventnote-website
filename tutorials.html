<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Events Notes — Tutorials</title>
  <meta name="description" content="Learn how to use Events Notes — bookings, timelines, Sun Track, payments, backups, team and more. Step-by-step guides for iPhone, iPad and Mac." />
  <meta name="color-scheme" content="light dark" />

  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/favicon.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="tutorials.css" />
</head>
<body class="tut-body">

  <!-- ===== Header / Nav (hidden in embed mode) ===== -->
  <header class="site-header tut-chrome">
    <nav class="nav container">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="Events Notes logo" class="brand-logo" />
        <span class="brand-name">Events Notes</span>
      </a>
      <ul class="nav-links nav-links--simple">
        <li><a href="index.html#features">Features</a></li>
        <li><a href="index.html#download" class="nav-cta">Download</a></li>
        <li class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="uk">UK</button>
          <button type="button" class="lang-btn" data-lang="ru">RU</button>
        </li>
      </ul>
    </nav>
  </header>

  <main class="tut-main">
    <!-- ===== Page intro ===== -->
    <section class="tut-hero">
      <div class="container tut-container">
        <h1 class="tut-title" data-t="page.title">How to use Events Notes</h1>
        <p class="tut-sub" data-t="page.sub">Short, practical guides to every feature — from your first booking to Sun Track, backups and team.</p>

        <!-- Language switch for embed mode (shown only when site chrome is hidden) -->
        <div class="tut-lang lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="uk">UK</button>
          <button type="button" class="lang-btn" data-lang="ru">RU</button>
        </div>

        <!-- Search -->
        <div class="tut-search">
          <svg class="tut-search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" id="tutSearch" class="tut-search-input" autocomplete="off" />
        </div>

        <!-- Category chips -->
        <nav class="tut-chips" id="tutChips" aria-label="Categories"></nav>
      </div>
    </section>

    <!-- ===== Guides render here ===== -->
    <section class="tut-guides">
      <div class="container tut-container" id="tutRoot"></div>
      <div class="container tut-container">
        <p class="tut-empty" id="tutEmpty" hidden data-t="search.empty">No guides match your search.</p>
      </div>
    </section>
  </main>

  <!-- ===== Footer (hidden in embed mode) ===== -->
  <footer class="site-footer tut-chrome">
    <div class="container footer-inner">
      <div class="footer-brand">
        <img src="assets/logo.png" alt="Events Notes logo" class="brand-logo" />
        <span>Events Notes</span>
      </div>
      <nav class="footer-links">
        <a href="index.html">Home</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Service</a>
        <a href="mailto:eventnoteapp@gmail.com">Support</a>
      </nav>
      <p class="footer-copy">© <span id="year"></span> Volodymyr Pysarenko.</p>
    </div>
  </footer>

  <script src="tutorials.js"></script>
</body>
</html>
